_version: 2

# GPU/NPU: an AI host's NVIDIA GPUs and Huawei Ascend NPUs.

gpu.panel.summary.one:
  en: "%{count} device"
gpu.panel.summary.other:
  zh-CN: 共 %{count} 个设备
  en: "%{count} devices"
gpu.panel.uptime:
  zh-CN: 已运行 %{duration}
  en: up %{duration}
gpu.panel.refresh:
  zh-CN: 刷新（自动每 %{seconds} 秒一次）
  en: Refresh (automatically every %{seconds} s)
gpu.panel.driver:
  zh-CN: 驱动 %{version}
  en: Driver %{version}
gpu.panel.paused:
  zh-CN: 已停止自动读取，点刷新按钮重试。
  en: Reading stopped. Click Refresh to try again.
gpu.panel.not_connected:
  zh-CN: 终端没有连接。连接后这里显示主机的 GPU 和 NPU。
  en: The terminal isn’t connected. Once it is, the host’s GPUs and NPUs show here.
gpu.panel.no_tools:
  zh-CN: 这台主机上没有 nvidia-smi 或 npu-smi。目前支持 NVIDIA GPU 和华为昇腾 NPU。
  en: This host has neither nvidia-smi nor npu-smi. NVIDIA GPUs and Huawei Ascend NPUs are supported.
gpu.panel.no_devices:
  zh-CN: 没有找到设备
  en: No devices found

