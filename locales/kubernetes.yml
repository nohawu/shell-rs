k8s.no_matches:
  zh-CN: 没有匹配的资源，请修改或清空搜索条件。
  en: No matching resources. Change or clear the search.

k8s.edit_yaml:
  zh-CN: 编辑 YAML
  en: Edit YAML
k8s.edit_yaml_note:
  zh-CN: 编辑配置后保存。标识、版本和状态字段不可修改；保存前需要确认。
  en: Edit the configuration, then save. Identity, version and status fields are read-only. Saving requires confirmation.
k8s.save_yaml:
  zh-CN: 保存修改…
  en: Save changes…
k8s.restart:
  zh-CN: 重启
  en: Restart
k8s.resource_actions:
  zh-CN: 资源操作
  en: Resource actions
k8s.save_title:
  zh-CN: "保存 %{name} 的修改？"
  en: "Save changes to %{name}?"
k8s.restart_title:
  zh-CN: "重启 %{name}？"
  en: "Restart %{name}?"
k8s.delete_title:
  zh-CN: "删除 %{name}？"
  en: "Delete %{name}?"
k8s.operation_scope:
  zh-CN: "集群：%{context}\n资源：%{resource}\n\n%{effect}"
  en: "Cluster: %{context}\nResource: %{resource}\n\n%{effect}"
k8s.save_effect:
  zh-CN: 配置将更新到集群，可能触发工作负载更新。如果资源已被修改，保存会提示冲突，请刷新后重新编辑。
  en: The configuration will be updated in the cluster and may trigger a workload rollout. If the resource has changed, saving will report a conflict. Refresh before editing again.
k8s.restart_effect:
  zh-CN: 按当前更新策略触发工作负载重启，运行中的 Pod 将被替换，服务可能短暂中断。
  en: Restart the workload using its update strategy. Running pods will be replaced and service may be interrupted.
k8s.pod_restart_effect:
  zh-CN: 删除当前 Pod，由控制器创建替代 Pod。临时数据可能丢失，服务可能中断；Job 中的任务可能重新执行。
  en: Delete this pod so its controller can create a replacement. Temporary data may be lost, service interrupted, and Job tasks may run again.
k8s.delete_effect:
  zh-CN: 资源将从集群删除，受其控制的资源可能一并删除。此操作无法撤销。
  en: The resource will be deleted from the cluster. Resources it controls may also be deleted. This cannot be undone.
k8s.pod_delete_effect:
  zh-CN: 删除当前 Pod，临时数据可能丢失；若有控制器管理，控制器可能创建替代 Pod。
  en: Delete this pod. Temporary data may be lost, and a managing controller may create a replacement.
k8s.namespace_delete_effect:
  zh-CN: 命名空间及其中所有资源将被删除，服务和数据可能丢失。此操作无法撤销。
  en: The namespace and all resources in it will be deleted. Services and data may be lost. This cannot be undone.
k8s.volume_delete_effect:
  zh-CN: 删除存储资源可能导致持久数据丢失，结果取决于存储与回收策略。此操作无法撤销。
  en: Deleting this storage resource may destroy persistent data, depending on its storage and reclaim policy. This cannot be undone.
k8s.saved:
  zh-CN: 资源修改已保存
  en: Resource changes saved
k8s.restart_requested:
  zh-CN: 重启请求已提交
  en: Restart requested
k8s.delete_requested:
  zh-CN: 删除请求已提交
  en: Deletion requested
k8s.operation_failed:
  zh-CN: "操作失败：%{error}"
  en: "Operation failed: %{error}"
k8s.operation_unsupported:
  zh-CN: 此资源不支持该操作。
  en: This operation is not supported for this resource.
k8s.mutation_identity_missing:
  zh-CN: 资源标识或版本不完整，请刷新详情后重试。
  en: The resource identity or version is incomplete. Refresh its details and retry.
k8s.edit_identity_fixed:
  zh-CN: 不能修改 apiVersion、kind、名称、命名空间、UID 或资源版本。
  en: API version, kind, name, namespace, UID and resource version cannot be changed.
k8s.edit_status_readonly:
  zh-CN: YAML 必须是单个资源，不能包含 status 字段。
  en: YAML must contain a single resource without a status field.
k8s.yaml_invalid:
  zh-CN: "YAML 无效：%{error}"
  en: "Invalid YAML: %{error}"
k8s.edit_unchanged:
  zh-CN: 配置没有变化。
  en: The configuration has not changed.
k8s.edit_changed:
  zh-CN: 编辑内容已变化，请重新保存并确认。
  en: The draft has changed. Save and confirm it again.
k8s.confirmation_expired:
  zh-CN: 确认的目标已改变，请重新打开资源后重试。
  en: The confirmation target has changed. Reopen the resource and retry.
k8s.edit_too_large:
  zh-CN: 资源超过 256 KB 编辑上限，请使用终端中的 kubectl 修改。
  en: The resource exceeds the 256 KB editing limit. Edit it with kubectl in the terminal.
k8s.pod_restart_unavailable:
  zh-CN: 此 Pod 没有可自动重建的工作负载控制器，或已运行结束，不能直接重启。
  en: This pod has no workload controller to recreate it, or has already finished. It cannot be restarted directly.
k8s.rollout_restart_unavailable:
  zh-CN: 此工作负载已暂停或使用 OnDelete 策略。请恢复自动更新，或逐个重建其 Pod。
  en: This workload is paused or uses OnDelete. Resume automatic updates or recreate its pods individually.
k8s.restart_terminating:
  zh-CN: 此资源正在删除，不能重启。请等待删除完成后查看替代资源。
  en: This resource is being deleted and cannot be restarted. Wait for deletion to finish, then inspect its replacement.

